<!DOCTYPE html>
<html lang="en" translate="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>VoidList</title>

  <link rel="icon" type="image/x-icon" href="./assets/icons/favicon/VoidList.svg">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/modals.css">
  <link rel="stylesheet" href="./css/utils.css">
  <link rel="stylesheet" href="./assets/fonts/fonts.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div>
        <h1>VoidList</h1>
        <p data-i18n="subtitle"></p>
      </div>
      <div class="menu-container">
        <input type="checkbox" class="menu-toggle" id="menu-toggle">
        <label for="menu-toggle" class="menu-label" data-i18n="menu" data-i18n-attr="title">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none">
            <rect class="bar top" x="4" y="7" height="2" width="16" fill="#fcfcfc" rx="1" />
            <rect class="bar middle" x="8" y="12" height="2" width="12" fill="#fcfcfc" rx="1" />
            <rect class="bar bottom" x="12" y="17" height="2" width="8" fill="#fcfcfc" rx="1" />
          </svg>
        </label>
        <button id="settings-btn" class="sub-btn">
          <img src="./assets/icons/settings.svg" data-i18n="settings" data-i18n-attr="title,alt">
        </button>
        <button id="share-btn" class="sub-btn">
          <img src="./assets/icons/share.svg" data-i18n="shareLists" data-i18n-attr="title,alt">
        </button>
        <button id="import-btn" class="sub-btn hidden">
          <img src="./assets/icons/import.svg" data-i18n="importLists" data-i18n-attr="title,alt">
        </button>
        <button id="access-btn" class="sub-btn hidden">
          <img src="./assets/icons/accessability.svg" data-i18n="accessibility" data-i18n-attr="title,alt">
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
      <aside class="closed">
        <div class="mobile-sidebar-header closed">
          <h2 class="mobile-sidebar-header-text" data-i18n="menu"></h2>
          <span role="button" class="mobile-sidebar-toggle" id="mobile-sidebar-toggle">▾</span>
        </div>
        <div class="sidebar-section mobile-hidden" id="lists-section">
          <div class="desktop-list-top">
            <h2 data-i18n="lists"></h2>
            <button id="new-list-btn" data-i18n="create"></button>
          </div>
          <div class="lists-container" id="lists-container">
            <!-- Lists will be added here dynamically -->
          </div>
        </div>
        <hr class="mobile-hidden" id="sidebar-separator">
        <div class="sidebar-section mobile-hidden" id="filters-section">
          <h2 data-i18n="filters"></h2>
          <div class="filter-options">
            <button data-filter="all" class="filter-btn sidebar-btn" data-i18n="allTasks">
              <img src="./assets/icons/dashed.svg" data-i18n="list" data-i18n-attr="alt"> -
            </button>
            <button data-filter="important" class="filter-btn sidebar-btn" data-i18n="important">
              <img src="./assets/icons/star.svg" data-i18n="star" data-i18n-attr="alt"> -
            </button>
            <button data-filter="today" class="filter-btn sidebar-btn" data-i18n="today">
              <img src="./assets/icons/calendar.svg" data-i18n="calendar" data-i18n-attr="alt"> -
            </button>
            <button data-filter="completed" class="filter-btn sidebar-btn" data-i18n="completed">
              <img src="./assets/icons/check.svg" data-i18n="check" data-i18n-attr="alt"> -
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Panel -->
      <div class="main-panel">
        <div class="current-list-container" id="current-list-container">
          <div class="current-list-header">
            <h2 id="current-list-title" data-i18n="selectList"></h2>
            <div>
              <button class="edit-list-btn" id="edit-list-btn" data-i18n="editList" data-i18n-attr="title">
                <img src="./assets/icons/edit.svg" data-i18n="edit" data-i18n-attr="alt">
              </button>
              <button class="delete-list-btn" id="delete-list-btn" data-i18n="deleteList" data-i18n-attr="title">
                <img src="./assets/icons/delete.svg" data-i18n="trashcan" data-i18n-attr="alt">
              </button>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="progress-container">
            <div class="progress-header">
              <span data-i18n="progress"></span>
              <span id="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-container">
              <div class="progress-bar" id="progress-bar"></div>
            </div>
          </div>

          <!-- Add Task Form -->
          <div class="task-input-container">
            <input type="text" id="new-task-input" data-i18n="addTaskPlaceholder" data-i18n-attr="placeholder" placeholder="Add a task..." class="task-input">
            <button id="add-task-btn" class="add-task-btn" data-i18n="addTask" data-i18n-attr="title">+</button>
          </div>
        </div>

        <!-- Tasks Container -->
        <div class="tasks-panel" id="tasks-panel">
          <div class="tasks-header">
            <h2 data-i18n="tasks"></h2>
            <div class="tasks-controls">
              <div class="sort-tasks-container">
                <select id="sort-tasks" class="sort-tasks">
                  <option value="newest" selected data-i18n="newestFirst"></option>
                  <option value="priority" data-i18n="priority"></option>
                  <option value="date" data-i18n="date"></option>
                  <option value="name" data-i18n="name"></option>
                </select>
              </div>
              <button id="clear-completed" class="clear-completed" data-i18n="clearDone"></button>
            </div>
          </div>

          <div id="tasks-container" class="tasks-container">
            <!-- Dummy Text / List Entries will be added here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <!-- New List Modal -->
  <div id="new-list-modal" class="modal hidden">
    <div class="modal-content fade-in">
      <div class="modal-header">
        <h2 data-i18n="createNewList"></h2>
        <button id="cancel-list" class="modal-close">✕</button>
      </div>

      <form id="new-list-form">
        <div>
          <input type="text" id="list-title-input" data-i18n="listName" data-i18n-attr="placeholder" required>
        </div>
        <div class="modal-buttons">
          <input type="color" data-i18n="listColor" data-i18n-attr="name" id="color-picker" class="color-picker">
          <button type="submit" data-i18n="create" class="submit-btn"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit List Modal -->
  <div id="edit-list-modal" class="modal hidden">
    <div class="modal-content fade-in">
      <div class="modal-header">
        <h2>Edit List</h2>
        <button id="cancel-list-edit" class="modal-close">✕</button>
      </div>

      <form id="edit-list-form">
        <div>
          <input type="text" id="editing-list-title-input" data-i18n="listName" data-i18n-attr="placeholder" placeholder="List name" required>
        </div>
        <div class="modal-buttons edit">
          <input type="color" data-i18n="listColor" data-i18n-attr="name" name="List Color" id="editing-color-picker" class="color-picker edit">
          <button data-i18n="apply" type="submit" class="submit-btn edit"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Export Lists Modal -->
  <div id="list-export-modal" class="modal hidden">
    <div class="modal-content fade-in">
      <div class="modal-header">
        <h2 data-i18n="exportLists"></h2>
        <button id="close-export-modal" class="modal-close">✕</button>
      </div>

      <h3 data-i18n="lists"></h3>
      <div id="export-list-space"></div>

      <h3 data-i18n="formats"></h3>
      <div class="export-formats">
        <div class="export-format-option selected-option" data-format="json">
          <div>
            <p class="export-format-preview">
              {<br>&thinsp;&thinsp;"To-Do List": {<br>&thinsp;&thinsp;&thinsp;&thinsp;"color":
              "#2c3dd0",<br>&thinsp;&thinsp;&thinsp;&thinsp;"tasks": [...]<br>&thinsp;&thinsp;}<br>}
            </p>
          </div>
          <p class="export-format-desc">
            <span>JSON Code</span><br><span data-i18n="jsonDesc"></span><br>
          </p>
        </div>
        <div class="export-format-option blocked" data-format="txt">
          <div>
            <p class="export-format-preview">
              To-Do List:<br>===============<br>&thinsp;&thinsp;○ Call Mom<br>&thinsp;&thinsp;○ Buy
              groceries<br>&thinsp;&thinsp;○ Pay bills
            </p>
          </div>
          <p class="export-format-desc">
            <span data-i18n="plainText"></span><br><span data-i18n="plainTextDesc"></span><br>
          </p>
        </div>
      </div>

      <h3 data-i18n="methods"></h3>
      <div class="export-btns">
        <button data-i18n="downloadLists" id="export-lists-btn"><img data-i18n="download" data-i18n-attr="alt" src="./assets/icons/download.svg">-</button>
        <button data-i18n="sendListsToFriend" id="share-lists-btn"><img data-i18n="sendTo" data-i18n-attr="alt" src="./assets/icons/sendto.svg">-</button>
        <div style="margin-left:12px;display:flex;border-radius:0;" class="blocked">
          <button data-i18n="saveListInClipboard" id="copy-lists-btn"><img data-i18n="copy" data-i18n-attr="alt" src="./assets/icons/copy.svg">-</button>
          <button data-i18n="renderQR" id="render-qr-btn"><img data-i18n="qrCode" data-i18n-attr="alt" src="./assets/icons/qrcode.svg">-</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Task Detail Modal -->
  <div id="task-detail-modal" class="modal hidden">
    <div class="modal-content fade-in">
      <div class="modal-header">
        <h2 data-i18n="taskDetails"></h2>
        <button id="cancel-task-edit" class="modal-close">✕</button>
      </div>
      <form id="task-detail-form">
        <div>
          <label for="edit-task-name" data-i18n="titleLabel"></label>
          <input type="text" id="edit-task-name" required>
        </div>
        <label for="edit-task-description" data-i18n="descriptionLabel"></label>
        <textarea id="edit-task-description" rows="2"></textarea>
        <div>
          <div>
            <label for="edit-task-due" data-i18n="dueDate"></label>
            <input type="date" id="edit-task-due">
          </div>
          <div>
            <label data-i18n="priority"></label>
            <select id="edit-task-priority">
              <option value="low" data-i18n="low"></option>
              <option value="medium" data-i18n="medium"></option>
              <option value="high" data-i18n="high"></option>
            </select>
          </div>
        </div>
        <div class="modal-buttons">
          <button type="submit" class="submit-btn" data-i18n="save"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content fade-in">
      <div class="modal-header">
        <h2 data-i18n="appSettings"></h2>
        <button id="close-settings-modal" class="modal-close">✕</button>
      </div>
      <form id="settings-form">
        <div class="settings-section">
          <h3 data-i18n="features"></h3>
          <div class="settings-item-container">
            <div class="settings-item">
              <input type="checkbox" id="enable-progress" class="settings-toggle-switch">
              <label for="enable-progress" class="settings-toggle-label"></label>
              <span data-i18n="showProgress"></span>
            </div>
            <div class="settings-item">
              <input type="checkbox" id="enable-animation" class="settings-toggle-switch">
              <label for="enable-animation" class="settings-toggle-label"></label>
              <span data-i18n="enableAnimations"></span>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <h3 data-i18n="appearance"></h3>
          <div class="theme-options">
            <button type="button" data-theme="dark" class="theme-option theme-dark selected-option" id="theme-dark">
              <div></div><span data-i18n="dark"></span>
            </button>
            <button type="button" data-theme="light" class="theme-option theme-light" id="theme-light">
              <div></div><span data-i18n="light"></span>
            </button>
            <button type="button" data-theme="system" class="theme-option theme-system" id="theme-system">
              <div></div><span data-i18n="system"></span>
            </button>
          </div>
        </div>

        <div class="settings-section">
          <h3 data-i18n="language"></h3>
          <div class="language-options">
            <button type="button" data-lang="english" class="language-option selected-option" id="lang-english">
              English
            </button>
            <button type="button" data-lang="german" class="language-option" id="lang-german">
              Deutsch
            </button>
            <button type="button" data-lang="russian" class="language-option" id="lang-russian">
              <span class="beta-label">Beta</span>
              Русский
            </button>
          </div>
        </div>

        <div class="modal-buttons">
          <button type="button" id="reset-settings" class="reset-settings" data-i18n="reset"></button>
          <button type="submit" class="submit-btn" id="submit-btn" data-i18n="apply"></button>
        </div>
      </form>
    </div>
  </div>

  <span class="version">v2.0.0</span>
  <footer>&copy; F4BiLL 2026.&nbsp;<span data-i18n="rightsReserved"></span></footer>

  <script type="module" src="js/main.js"></script>
</body>
 
</html>
